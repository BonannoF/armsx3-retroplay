# Builds the ARMSX3 core (the PlayStation 3 emulator of the ARMSX2 team: RPCS3 for Android on ARM64, GPL-2.0) for RetroPlay.
# ARMSX3's core is RPCSX's Android glue grown further (the same _rpcsx_* functions, plus up to seven pads, save states in slots, pause,
# rumble per pad, patches, disc changes): the app's PS3 bridge talks to it as it talks to RPCSX. No change to its code is needed.
#
# How to use it:
#   1. On GitHub create a new empty repository (private is fine), e.g. "armsx3-retroplay".
#   2. Add this one file to it as .github/workflows/build-armsx3-retroplay.yml ("Add file" -> "Create new file", paste, commit).
#   3. Actions tab -> "Build ARMSX3 for RetroPlay" -> Run workflow (one to two hours: LLVM is built from source first).
#   4. Download the artifact "armsx3-core-android-retroplay" (libarmsx3-core.so, its SHA256 and size) and send it.
#
# It builds the core the way ARMSX3's own scripts do (android/configure.sh and android/build-variants.sh; the README is shorter and
# leaves out the options): from the repository root, no SDL, no system libraries but zlib, LLVM from its submodule linked statically,
# and the "a11" variant: Android 11 (API 30), armv8.2-a with dotprod and fp16, the most widely compatible of its modern builds.

name: Build ARMSX3 for RetroPlay

on:
  workflow_dispatch:
    inputs:
      armsx3_ref:
        description: "ARMSX3 commit to build (3ea49c2a = release 1.3.2, 2026-10-20)"
        default: "3ea49c2a394478d6fb64452be922a3b4b9994d3b"
      march:
        description: "CPU level (ARMSX3's a11 variant; armv8.1-a is its legacy one)"
        default: "armv8.2-a+dotprod+fp16"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      NDK_VERSION: "29.0.14206865"
      CMAKE_VERSION: "3.30.5"
      API_LEVEL: "30"
    steps:
      - name: Free disk space (LLVM and the emulator need most of the runner's disk)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Checkout ARMSX3
        uses: actions/checkout@v5
        with:
          repository: ARMSX2/ARMSX3
          ref: ${{ github.event.inputs.armsx3_ref }}
          path: armsx3
          submodules: recursive
          fetch-depth: 0
          lfs: true

      - name: Third-party checkouts the README names (not submodules)
        working-directory: armsx3
        run: |
          [ -d 3rdparty/librashader/include ] || git clone --depth 1 https://github.com/SnowflakePowered/librashader 3rdparty/librashader
          [ -d android/armsx3-ui/app/src/main/cpp/libadrenotools/include ] || git clone --depth 1 --recursive https://github.com/bylaws/libadrenotools android/armsx3-ui/app/src/main/cpp/libadrenotools
          git log -1 --format='ARMSX3 %H %cd %s'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install CMake and NDK
        run: |
          yes | sdkmanager "cmake;${{ env.CMAKE_VERSION }}" "ndk;${{ env.NDK_VERSION }}"
          echo "NDK_ROOT=$ANDROID_SDK_ROOT/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmake/${{ env.CMAKE_VERSION }}/bin" >> "$GITHUB_PATH"

      - name: Configure (the options of ARMSX3's android/configure.sh)
        working-directory: armsx3
        run: |
          cmake -S . -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-$API_LEVEL \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_NATIVE_INSTRUCTIONS=OFF \
            -DUSE_SDL=OFF \
            -DUSE_SYSTEM_SDL=OFF \
            -DUSE_GAMEMODE=OFF \
            -DUSE_SYSTEM_LIBUSB=OFF \
            -DUSE_SYSTEM_CURL=OFF \
            -DUSE_SYSTEM_OPENCV=OFF \
            -DUSE_SYSTEM_FFMPEG=OFF \
            -DUSE_SYSTEM_ZLIB=ON \
            -DUSE_DISCORD_RPC=OFF \
            -DUSE_FAUDIO=OFF \
            -DUSE_LIBEVDEV=OFF \
            -DWITH_LLVM=ON \
            -DBUILD_LLVM=ON \
            -DSTATIC_LINK_LLVM=ON \
            -DUSE_LTO=OFF \
            -DASMJIT_NO_SHM_OPEN=ON \
            "-DARMSX3_ARM_MARCH=${{ github.event.inputs.march }}"

      - name: Build the core
        working-directory: armsx3
        run: ninja -C build-android android/libarmsx3-core.so

      - name: Package
        working-directory: armsx3
        run: |
          SO=build-android/android/libarmsx3-core.so
          if [ ! -f "$SO" ]; then echo "::error::libarmsx3-core.so was not built"; exit 1; fi
          mkdir -p ../out
          "$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" --strip-unneeded -o ../out/libarmsx3-core.so "$SO"
          git log -1 --format='%H' > ../out/COMMIT.txt
          sha256sum ../out/libarmsx3-core.so | tee ../out/SHA256.txt
          stat -c %s ../out/libarmsx3-core.so | tee ../out/BYTES.txt
          # The functions the app's PS3 bridge needs (names may be C++-mangled: matched as text).
          NM="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          "$NM" -D --defined-only ../out/libarmsx3-core.so > ../out/EXPORTS.txt
          for f in _rpcsx_initialize _rpcsx_boot _rpcsx_getState _rpcsx_kill _rpcsx_surfaceEvent _rpcsx_overlayPadData _rpcsx_usbDeviceEvent _rpcsx_installFw _rpcsx_install _rpcsx_settingsSet _rpcsx_getTitleId _rpcsx_saveStateToSlot _rpcsx_loadStateFromSlot; do
            grep -q "$f" ../out/EXPORTS.txt && echo "exports $f" || echo "::warning::$f is not exported"
          done
          ls -la ../out

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: armsx3-core-android-retroplay
          path: out/*
          if-no-files-found: error
