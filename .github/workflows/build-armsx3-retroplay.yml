# Builds the ARMSX3 core (the PlayStation 3 emulator of the ARMSX2 team: RPCS3 for Android on ARM64, GPL-2.0) for RetroPlay.
# ARMSX3's core is RPCSX's Android glue grown further (the same _rpcsx_* functions, plus up to seven pads, save states in slots, pause,
# rumble per pad, patches, disc changes): the app's PS3 bridge talks to it as it talks to RPCSX. Three changes (below):
# PS3/armsx3-xmb-precompile.patch, PS3/armsx3-atomic16-padding.patch and PS3/armsx3-vsh-disc.patch.
#
# How to use it:
#   1. On GitHub create a new empty repository (private is fine), e.g. "armsx3-retroplay".
#   2. Add this one file to it as .github/workflows/build-armsx3-retroplay.yml ("Add file" -> "Create new file", paste, commit).
#   3. Actions tab -> "Build ARMSX3 for RetroPlay" -> Run workflow (one to two hours: LLVM is built from source first).
#   4. Download the artifact "armsx3-core-android-retroplay" (libarmsx3-core.so, its SHA256 and size) and send it.
#
# It builds the core the way ARMSX3's own scripts do (android/configure.sh and android/build-variants.sh; the README is shorter and
# leaves out the options): from the repository root, no SDL, no system libraries but zlib, LLVM from its submodule linked statically,
# and the "a11" variant: Android 11 (API 30), armv8.2-a with dotprod and fp16, the most widely compatible of its modern builds.

name: Build ARMSX3 for RetroPlay

on:
  workflow_dispatch:
    inputs:
      armsx3_ref:
        description: "ARMSX3 commit to build (054291ef = release 1.4.1)"
        default: "054291ef7cf2c166c17163fc03667f4086885844"
      march:
        description: "CPU level (ARMSX3's a11 variant; armv8.1-a is its legacy one)"
        default: "armv8.2-a+dotprod+fp16"
      mtune:
        description: "CPU the code is scheduled for (any arm64 phone still runs it): cortex-a78 = the big cores of Snapdragon 8xx and Dimensity"
        default: "cortex-a78"
      diagnostics:
        description: "Test build only: add RetroPlay's VUART log lines (PS3/armsx3-uart-diag.patch). Never ship it."
        default: "false"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      NDK_VERSION: "29.0.14206865"
      CMAKE_VERSION: "3.30.5"
      API_LEVEL: "30"
    steps:
      - name: Free disk space (LLVM and the emulator need most of the runner's disk)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Checkout ARMSX3
        uses: actions/checkout@v5
        with:
          repository: ARMSX2/ARMSX3
          ref: ${{ github.event.inputs.armsx3_ref }}
          path: armsx3
          submodules: recursive
          fetch-depth: 0
          lfs: true

      - name: Third-party checkouts the README names (not submodules)
        working-directory: armsx3
        run: |
          [ -d 3rdparty/librashader/include ] || git clone --depth 1 https://github.com/SnowflakePowered/librashader 3rdparty/librashader
          [ -d android/armsx3-ui/app/src/main/cpp/libadrenotools/include ] || git clone --depth 1 --recursive https://github.com/bylaws/libadrenotools android/armsx3-ui/app/src/main/cpp/libadrenotools
          git log -1 --format='ARMSX3 %H %cd %s'

      - name: Fix a header name only a macOS build finds
        working-directory: armsx3
        run: |
          # FrameGenTypes.h includes "Config.h", which is not in the repository: the only one is Utilities/Config.h (which it already
          # gets through Emu/system_config.h). ARMSX3 is built on macOS, whose include search finds it anyway; Linux stops on it.
          F=rpcs3/Emu/RSX/VK/FrameGen/FrameGenTypes.h
          sed -i 's|#include "Config.h"|#include "Utilities/Config.h"|' "$F"
          grep -n 'Config.h' "$F"

      - name: Fix every include written in the wrong case (macOS ignores the case of file names, Linux does not)
        working-directory: armsx3
        shell: python
        run: |
          import os, re
          root = os.getcwd()
          skip = {'.git', 'build-android'}
          real = {}
          for d, dirs, files in os.walk(root):
              dirs[:] = [x for x in dirs if x not in skip]
              for f in files:
                  p = os.path.relpath(os.path.join(d, f), root).replace(os.sep, '/')
                  real.setdefault(p.lower(), p)
          exact = set(real.values())
          bases = ['', 'rpcs3/', 'rpcs3/Emu/', 'Utilities/', '3rdparty/', 'android/src/']
          pattern = re.compile(r'(#\s*include\s*["<])([^">]+)([">])')
          fixed = 0
          for top in ('rpcs3', 'Utilities', 'android/src', '3rdparty/lsfg'):
              for d, dirs, files in os.walk(os.path.join(root, top)):
                  dirs[:] = [x for x in dirs if x not in skip]
                  for f in files:
                      if not f.endswith(('.cpp', '.h', '.hpp', '.inl', '.c', '.cc')):
                          continue
                      path = os.path.join(d, f)
                      here = os.path.relpath(d, root).replace(os.sep, '/') + '/'
                      with open(path, encoding='utf-8', errors='surrogateescape') as fh:
                          text = fh.read()
                      def repl(m):
                          global fixed
                          inc = m.group(2)
                          candidates = [os.path.normpath(here + inc).replace(os.sep, '/')] + [b + inc for b in bases]
                          if any(c in exact for c in candidates):
                              return m.group(0)
                          for c in candidates:
                              hit = real.get(c.lower())
                              if hit and hit != c:
                                  good = hit[len(hit) - len(inc):]
                                  print(f'{os.path.relpath(path, root)}: {inc} -> {good}')
                                  fixed += 1
                                  return m.group(1) + good + m.group(3)
                          return m.group(0)
                      new = pattern.sub(repl, text)
                      if new != text:
                          with open(path, 'w', encoding='utf-8', errors='surrogateescape') as fh:
                              fh.write(new)
          print(f'{fixed} include(s) fixed')

      - name: RetroPlay's change (the system menu precompiles only the modules it runs)
        working-directory: armsx3
        env:
          PATCH_SHA256: "5b69a0211cf6f3763077c554bac572811d2a53de26b601fbd8992a26e097a6e1"
          PATCH_BASE64: ""
        run: |
          # The same file as PS3/armsx3-xmb-precompile.patch of the RetroPlay project (GPL-2.0: shipped with the app as its changes).
          echo "$PATCH_BASE64" | base64 -d > ../armsx3-xmb-precompile.patch
          echo "$PATCH_SHA256  ../armsx3-xmb-precompile.patch" | sha256sum -c -
          git apply --check --verbose ../armsx3-xmb-precompile.patch
          git apply ../armsx3-xmb-precompile.patch
          git diff --stat

      - name: RetroPlay's fix (16-byte atomics keep their padding - the system menu's audio init spun for ever)
        working-directory: armsx3
        env:
          PATCH_SHA256: "552d129a646c84b4cf0e28557120d4512f65f1a31c16152cdd60a48352eac411"
          PATCH_BASE64: ""
        run: |
          # The same file as PS3/armsx3-atomic16-padding.patch of the RetroPlay project (GPL-2.0: shipped with the app as its changes).
          echo "$PATCH_BASE64" | base64 -d > ../armsx3-atomic16-padding.patch
          echo "$PATCH_SHA256  ../armsx3-atomic16-padding.patch" | sha256sum -c -
          git apply --check --verbose ../armsx3-atomic16-padding.patch
          git apply ../armsx3-atomic16-padding.patch
          git diff --stat

      - name: RetroPlay's change (the system menu can start with a disc of the library in the drive)
        working-directory: armsx3
        env:
          PATCH_SHA256: "19cd42c753fc06320e3a6b4883f82410d2430ae5ab010ce2eb253e399b757c36"
          PATCH_BASE64: ""
        run: |
          # The same file as PS3/armsx3-vsh-disc.patch of the RetroPlay project (GPL-2.0: shipped with the app as its changes).
          echo "$PATCH_BASE64" | base64 -d > ../armsx3-vsh-disc.patch
          echo "$PATCH_SHA256  ../armsx3-vsh-disc.patch" | sha256sum -c -
          git apply --check --verbose ../armsx3-vsh-disc.patch
          git apply ../armsx3-vsh-disc.patch
          git diff --stat

      - name: RetroPlay diagnostics (test builds only - the VUART AV port of the system menu)
        if: ${{ github.event.inputs.diagnostics == 'true' }}
        working-directory: armsx3
        env:
          PATCH_SHA256: "1740ecf8262ede695721b8e9239a92c19828747af22a76a68e356110d9d42134"
          PATCH_GZ_BASE64: ""
        run: |
          echo "$PATCH_GZ_BASE64" | base64 -d | gunzip > ../armsx3-uart-diag.patch
          echo "$PATCH_SHA256  ../armsx3-uart-diag.patch" | sha256sum -c -
          git apply --check --verbose ../armsx3-uart-diag.patch
          git apply ../armsx3-uart-diag.patch
          git diff --stat

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install CMake and NDK
        run: |
          yes | sdkmanager "cmake;${{ env.CMAKE_VERSION }}" "ndk;${{ env.NDK_VERSION }}"
          echo "NDK_ROOT=$ANDROID_SDK_ROOT/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmake/${{ env.CMAKE_VERSION }}/bin" >> "$GITHUB_PATH"

      - name: Configure (the options of ARMSX3's android/configure.sh)
        working-directory: armsx3
        env:
          # Read by CMake's first configure and put before the NDK toolchain's own flags (which a -DCMAKE_CXX_FLAGS would replace).
          CFLAGS: -mtune=${{ github.event.inputs.mtune }}
          CXXFLAGS: -mtune=${{ github.event.inputs.mtune }}
        run: |
          cmake -S . -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-$API_LEVEL \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_NATIVE_INSTRUCTIONS=OFF \
            -DUSE_SDL=OFF \
            -DUSE_SYSTEM_SDL=OFF \
            -DUSE_GAMEMODE=OFF \
            -DUSE_SYSTEM_LIBUSB=OFF \
            -DUSE_SYSTEM_CURL=OFF \
            -DUSE_SYSTEM_OPENCV=OFF \
            -DUSE_SYSTEM_FFMPEG=OFF \
            -DUSE_SYSTEM_ZLIB=ON \
            -DUSE_DISCORD_RPC=OFF \
            -DUSE_FAUDIO=OFF \
            -DUSE_LIBEVDEV=OFF \
            -DWITH_LLVM=ON \
            -DBUILD_LLVM=ON \
            -DSTATIC_LINK_LLVM=ON \
            -DUSE_LTO=OFF \
            -DASMJIT_NO_SHM_OPEN=ON \
            "-DARMSX3_ARM_MARCH=${{ github.event.inputs.march }}"

      - name: Build the core
        working-directory: armsx3
        run: ninja -C build-android android/libarmsx3-core.so

      - name: Package
        working-directory: armsx3
        run: |
          SO=build-android/android/libarmsx3-core.so
          if [ ! -f "$SO" ]; then echo "::error::libarmsx3-core.so was not built"; exit 1; fi
          mkdir -p ../out
          "$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" --strip-unneeded -o ../out/libarmsx3-core.so "$SO"
          git log -1 --format='%H' > ../out/COMMIT.txt
          sha256sum ../out/libarmsx3-core.so | tee ../out/SHA256.txt
          stat -c %s ../out/libarmsx3-core.so | tee ../out/BYTES.txt
          # The functions the app's PS3 bridge needs (names may be C++-mangled: matched as text).
          NM="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          "$NM" -D --defined-only ../out/libarmsx3-core.so > ../out/EXPORTS.txt
          for f in _rpcsx_initialize _rpcsx_boot _rpcsx_getState _rpcsx_kill _rpcsx_surfaceEvent _rpcsx_overlayPadData _rpcsx_usbDeviceEvent _rpcsx_installFw _rpcsx_install _rpcsx_settingsSet _rpcsx_getTitleId _rpcsx_saveStateToSlot _rpcsx_loadStateFromSlot; do
            grep -q "$f" ../out/EXPORTS.txt && echo "exports $f" || echo "::warning::$f is not exported"
          done
          ls -la ../out

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: armsx3-core-android-retroplay
          path: out/*
          if-no-files-found: error
